services:
  argus:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - argus-data:/data
    environment:
      ARGUS_DATA_DIR: /data
      ARGUS_CORS_ORIGINS: ""
    restart: unless-stopped
    # Uncomment for GPU inference (~2ms/part instead of ~35ms on CPU).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  argus-data:
